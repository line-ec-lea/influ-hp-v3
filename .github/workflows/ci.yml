name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: |
          bun scripts/check-dependency-sources.mjs
          bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Check editorial error handling
        run: node scripts/check-editorial-errors.mjs

      - name: Build
        run: bun run build
