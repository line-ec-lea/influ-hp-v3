name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify original parity
        run: node scripts/check-original-parity.mjs
